name: Feature request
description: Suggest something the plugin should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: Describe the situation on your server, not the implementation you have in mind.
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like it to do
  - type: input
    id: gamemode
    attributes:
      label: Which gamemode / server type is this for
